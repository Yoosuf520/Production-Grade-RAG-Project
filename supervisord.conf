[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid

# --- 1. FastAPI Backend Service ---
[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 8080 --loop asyncio --timeout-graceful-shutdown 5
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --- 2. Streamlit Chat UI Service ---
[program:ui]
command=streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --- 3. Streamlit Evals UI Service ---
[program:evals]
command=streamlit run evals/app.py --server.port=8502 --server.address=0.0.0.0
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0